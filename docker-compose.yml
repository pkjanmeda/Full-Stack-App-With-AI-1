version: "3.9"
services:
  nats:
    image: nats:latest
    command: ["-js", "--jetstream", "--store_dir", "/data/jetstream"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats/data:/data

  api:
    build: ./services/api
    depends_on:
      - nats
      - langgraph
    environment:
      - NATS_URL=nats://nats:4222
      - LANGGRAPH_URL=http://langgraph:5000
      - PORT=4000
    ports:
      - "4000:4000"

  frontend:
    build: ./services/frontend
    depends_on:
      - api
    ports:
      - "3000:3000"

  shift-worker:
    build: ./services/shift-worker
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222

  kpi-worker:
    build: ./services/kpi-worker
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222

  langgraph:
    build: ./services/langgraph
    depends_on:
      - nats
    environment:
      - LANGGRAPH_MODE=local
      - NATS_URL=nats://nats:4222
    ports:
      - "5000:5000"
