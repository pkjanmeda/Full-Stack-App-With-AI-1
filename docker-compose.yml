version: "3.9"
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    volumes:
      - ./phoenix:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

  nats:
    image: nats:latest
    command: ["-js", "--jetstream", "--store_dir", "/data/jetstream"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats/data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  cosmos-emulator:
    build: ./services/cosmos-emulator
    ports:
      - "8081:8081"
      - "10250:10250"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=1
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true

  api:
    build: ./services/api
    depends_on:
      - phoenix
      - nats
      - langgraph-orchestrator
    environment:
      - NATS_URL=nats://nats:4222
      - LANGGRAPH_URL=http://langgraph-orchestrator:5000
      - PORT=4000
      - OTEL_SERVICE_NAME=api-service
      - OTEL_ENVIRONMENT=local
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "4000:4000"

  frontend:
    build: ./services/frontend
    depends_on:
      - api
    ports:
      - "3000:3000"

  shift-worker:
    build: ./services/shift-worker
    depends_on:
      - phoenix
      - nats
      - cosmos-emulator
    environment:
      - NATS_URL=nats://nats:4222
      - COSMOS_ENDPOINT=https://cosmos-emulator:8081/
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - COSMOS_DB=factory_ops
      - COSMOS_CONTAINER=shift_data
      - OTEL_SERVICE_NAME=shift-worker
      - OTEL_ENVIRONMENT=local
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}

  kpi-worker:
    build: ./services/kpi-worker
    depends_on:
      - phoenix
      - nats
      - cosmos-emulator
    environment:
      - NATS_URL=nats://nats:4222
      - COSMOS_ENDPOINT=https://cosmos-emulator:8081/
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - COSMOS_DB=factory_ops
      - COSMOS_CONTAINER=kpi_data
      - OTEL_SERVICE_NAME=kpi-worker
      - OTEL_ENVIRONMENT=local
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}

  langgraph-orchestrator:
    build: ./services/langgraph-orchestrator
    depends_on:
      - phoenix
      - nats
      - redis
    environment:
      - LANGGRAPH_MODE=local
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
      - REDIS_MEMORY_TTL_SECONDS=3600
      - REDIS_MEMORY_MAX_TURNS=50
      - REDIS_SEMANTIC_THRESHOLD=0.72
      - OTEL_SERVICE_NAME=langgraph-orchestrator
      - OTEL_ENVIRONMENT=local
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "5000:5000"
