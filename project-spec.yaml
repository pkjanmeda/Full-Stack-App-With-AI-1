project:
  name: full-stack-ai-chat-stream
  description: |
    Modular, scalable full-stack web application with a chat interface, API endpoint,
    NATS JetStream-based backend streaming, worker pool running AI agents, and local
    container deployment. Workers should be designed to run on the LangGraph platform.

goals:
  - Provide a lightweight web chat UI with live streaming response support.
  - Offer a REST API endpoint for the chat frontend to submit messages.
  - Use NATS JetStream for backend message brokering and streaming responses.
  - Implement a worker pool that consumes messages, executes AI-style agents, and
    publishes generated content back into JetStream.
  - Enable all services to run locally in containers through Docker Compose.
  - Keep the architecture modular and scalable, with clear service boundaries.

architecture:
  components:
    frontend:
      type: web application
      responsibilities:
        - render chat UI and conversation history
        - send user messages to the API endpoint
        - receive streamed AI responses from a streaming endpoint
      technology-suggestions:
        - React or Vue for UI
        - TypeScript for type safety
        - Fetch API + EventSource / WebSocket for streaming

    api_service:
      type: backend REST/API service
      responsibilities:
        - accept inbound chat messages from the frontend
        - validate request payloads and session metadata
        - publish incoming messages to a NATS JetStream 'incoming' stream
        - optionally provide a streaming endpoint for response delivery (SSE/WebSocket)
      technology-suggestions:
        - Node.js + Express or Fastify
        - Python + FastAPI
        - TypeScript if using Node.js

    nats_jetstream:
      type: message broker / event bus
      responsibilities:
        - host a JetStream stream for inbound user messages
        - host a JetStream stream for worker responses
        - support durable consumers, acknowledgements, and ordered delivery
      configuration:
        streams:
          - name: chat_incoming
            subjects: ["chat.incoming"]
          - name: chat_response
            subjects: ["chat.response"]
        consumers:
          - name: worker_consumer
            stream: chat_incoming
            deliver_policy: all
            ack_policy: explicit

    worker_pool:
      type: containerized worker service
      responsibilities:
        - subscribe to NATS JetStream chat_incoming messages
        - execute a simple AI agent pipeline for each message
        - enrich or randomize response text using small tool plugins
        - publish responses to the chat_response stream
      requirements:
        - support horizontal scaling via multiple worker instances
        - use durable JetStream consumer group or queue subscription
      example-tools:
        - random_text_inserter: add playful phrases or randomized facts
        - format_helper: ensure responses include metadata or voice style
        - session_mapper: attach session IDs and trace IDs to responses

    langgraph_runtime:
      type: worker orchestration/integration
      responsibilities:
        - run worker AI agents on the LangGraph platform
        - expose a local development mode for LangGraph-based execution
        - connect LangGraph tasks to the worker pool logic
      notes: |
        The LangGraph platform should be used to host and orchestrate AI agent behavior.
        Workers may contain a small LangGraph agent definition, tool registration, and
        runtime adapter to invoke tools in a local container environment.

message_flow:
  - user enters text in frontend chat interface
  - frontend sends POST /api/chat with payload { sessionId, message }
  - API service publishes message to NATS JetStream subject chat.incoming
  - worker pool consumers receive the message from chat_incoming stream
  - each worker executes AI agent logic and enriches text using tools
  - worker publishes completed response to NATS JetStream subject chat.response
  - API service or frontend subscribes to chat.response stream and streams updates
  - frontend renders partial or full streamed response live in chat UI

api_spec:
  endpoints:
    - path: /api/chat
      method: POST
      description: send a user message
      request:
        content-type: application/json
        body:
          sessionId: string
          message: string
      response:
        200:
          body: { status: "queued", messageId: string }
    - path: /api/chat/stream
      method: GET
      description: subscribe to response stream for a session
      query:
        sessionId: string
      response:
        content-type: text/event-stream or application/json chunked

frontend_features:
  - chat bubble UI with timestamps and sender labels
  - input box with send button and enter-to-submit
  - streaming response rendering (text appended as it arrives)
  - connection state indicator and retry behavior
  - optional session selector or conversation history

deployment:
  targeting: local container development with Docker Compose
  containers:
    - name: nats
      image: nats:latest
      ports: [4222, 8222]
      volumes:
        - ./nats/data:/data
      command: ["-js"]
    - name: api
      build: ./services/api
      depends_on: [nats]
      environment:
        - NATS_URL=nats://nats:4222
    - name: frontend
      build: ./services/frontend
      ports: [3000:3000]
      depends_on: [api]
    - name: shift-worker
      build: ./services/shift-worker
      depends_on: [nats]
      environment:
        - NATS_URL=nats://nats:4222
    - name: langgraph_agent
      build: ./services/langgraph
      depends_on: [shift-worker]
      environment:
        - LANGGRAPH_MODE=local

scalability:
  - separate backend, frontend, message broker, and worker responsibilities
  - decouple streaming from request handling with JetStream
  - make worker instances stateless and horizontally scalable
  - use environment variables for broker, service, and LangGraph configuration
  - add service-specific logs and structured tracing fields
  - design modules with clear boundaries and small adapter layers

local_dev:
  - run NATS JetStream locally via Docker Compose
  - start API and frontend containers together
  - verify worker pool can connect to NATS and process sample messages
  - optionally start a local LangGraph runtime or mock if not available

project_structure:
  - services/
    - api/
    - frontend/
    - worker/
    - langgraph/
  - docker-compose.yml
  - project-spec.yaml
  - README.md
  - .env.example
  - nats/

quality:
  - modular code with clearly separated service directories
  - small interfaces for NATS publish/subscribe and message formats
  - simple automated tests for API endpoint and worker processing
  - documented startup instructions and local environment variables

success_criteria:
  - frontend chat UI sends a message and receives a streamed response
  - API publishes inbound messages to JetStream correctly
  - worker pool processes messages and publishes valid responses
  - NATS JetStream streams are configured and durable for local testing
  - entire stack can be started with Docker Compose locally
  - LangGraph worker integration is scaffolded and callable from workers
