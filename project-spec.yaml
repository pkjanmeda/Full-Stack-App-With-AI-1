project:
  name: full-stack-ai-chat-stream
  description: |
    Containerized full-stack chat system with LangGraph-based routing, NATS JetStream
    messaging, specialized workers, Cosmos-backed KPI retrieval, and local Arize Phoenix
    tracing via OpenTelemetry.
  status: active

goals:
  - Provide a simple web chat UI with live WebSocket streaming updates.
  - Route each chat request through a local LangGraph orchestrator service.
  - Maintain short-term per-session conversation memory in Redis.
  - Use semantic cache lookup in Redis before running full routing/worker flow.
  - Process domain tasks using separate worker services (shift and KPI).
  - Persist and query KPI demo data through a local Cosmos emulator.
  - Run all components locally with Docker Compose.
  - Expose distributed trace data to a local Arize Phoenix instance.

runtime:
  orchestrator: docker-compose
  primary_ports:
    frontend: 3000
    api: 4000
    langgraph: 5000
    phoenix: 6006
    nats_client: 4222
    nats_monitoring: 8222

architecture:
  components:
    frontend:
      type: react + vite web client
      path: services/frontend
      responsibilities:
        - send POST /api/chat with sessionId and message
        - open WebSocket to /api/chat/ws/{sessionId} after first POST
        - send optional follow-up questions over the same WebSocket connection
        - render agent responses as incremental partial updates

    api:
      type: fastapi gateway
      path: services/api
      responsibilities:
        - accept first chat request at /api/chat
        - call langgraph /orchestrate first
        - fallback publish to chat.incoming if langgraph call fails
        - provide WebSocket endpoint /api/chat/ws/{sessionId}
        - stream session-filtered chat.response events over WebSocket
        - accept optional follow-up messages over WebSocket
        - emit streamed words at ~100ms intervals for visible tokenized output

    langgraph:
      type: fastapi orchestration service
      path: services/langgraph
      responsibilities:
        - perform semantic cache search against Redis memory
        - store short-term conversation turns in Redis per session
        - evaluate incoming message against local graph node keyword rules
        - route shift messages to subject chat.incoming
        - route KPI messages to subject chat.kpi
        - publish decline response directly to chat.response when unmatched

    redis:
      type: short-term cache and memory store
      responsibilities:
        - store recent conversation turns by session id with TTL
        - support semantic similarity lookup for cache hits

    shift_worker:
      type: nats jetstream worker
      path: services/shift-worker
      responsibilities:
        - consume chat.incoming (durable consumer worker_pool)
        - generate randomized shift-style response text
        - publish response to chat.response

    kpi_worker:
      type: nats jetstream + cosmos worker
      path: services/kpi-worker
      responsibilities:
        - consume chat.kpi (durable consumer kpi_worker_pool)
        - query cosmos-emulator dataset for KPI/product metrics
        - publish KPI response to chat.response with kpiHits metadata

    nats:
      type: nats jetstream broker
      responsibilities:
        - host stream chat_incoming for subject chat.incoming
        - host stream chat_kpi for subject chat.kpi
        - host stream chat_response for subject chat.response

    cosmos_emulator:
      type: local azure cosmos emulator service
      path: services/cosmos-emulator
      responsibilities:
        - provide local Cosmos API endpoint for KPI worker
        - persist seeded synthetic KPI documents

    phoenix:
      type: arize phoenix observability backend
      responsibilities:
        - receive OTLP traces from services
        - provide local trace visualization UI

message_flow:
  - frontend POSTs message to api /api/chat
  - frontend opens websocket to /api/chat/ws/{sessionId}
  - api starts trace span and forwards request to langgraph /orchestrate
  - langgraph checks redis semantic memory for similar prior question in same session
  - if similarity is above threshold, langgraph publishes cached response directly
  - langgraph selects target route (chat.incoming, chat.kpi, or direct decline)
  - selected worker consumes routed message and publishes chat.response
  - api websocket session subscribes to chat.response and filters by sessionId
  - frontend may send follow-up messages through websocket to api
  - api emits partial word-by-word updates and final message to frontend

api_contract:
  endpoints:
    - path: /api/chat
      method: POST
      request_body:
        sessionId: string | null
        message: string
      response:
        status: queued
        messageId: string
        sessionId: string
        orchestration: forwarded | declined | null

    - path: /api/chat/ws/{sessionId}
      method: WS
      direction: bidirectional
      response:
        content_type: application/json over websocket frames
        payload_fields:
          - sessionId
          - reply
          - isPartial
          - responseSource
      request_payload:
        type: chat
        message: string

    - path: /orchestrate
      method: POST
      owner: langgraph
      request_body:
        sessionId: string
        task: string
        payload:
          message: string
      response:
        status: forwarded | declined
        target: string | null

telemetry:
  provider: opentelemetry
  local_backend: arize phoenix
  transport: otlp http
  context_propagation:
    - http headers between api and langgraph
    - nats message headers between langgraph/workers/api websocket stream
  key_annotations:
    - chat.session_id
    - chat.message_length
    - chat.orchestration
    - orchestration.target
    - orchestration.candidates
    - orchestration.matched_keywords
    - stream.word_count
    - stream.first_chunk_latency_ms
    - stream.total_duration_ms
    - kpi.query.hit_count

deployment:
  compose_file: docker-compose.yml
  services:
    - phoenix
    - nats
    - redis
    - cosmos-emulator
    - api
    - frontend
    - shift-worker
    - kpi-worker
    - langgraph
  required_env:
    - NATS_URL
    - LANGGRAPH_URL
    - LANGGRAPH_MODE
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_EXPORTER_OTLP_HEADERS

project_structure:
  - services/api
  - services/frontend
  - services/langgraph
  - services/shift-worker
  - services/kpi-worker
  - services/cosmos-emulator
  - nats
  - phoenix
  - docker-compose.yml
  - project-spec.yaml
  - README.md

current_limits:
  - routing is keyword-based and local (no external LLM provider)
  - no auth/rbac layer
  - no formal automated test suite committed yet
  - compose file still includes deprecated top-level version key

success_criteria:
  - frontend sends chat and receives progressive streamed response
  - langgraph routes to appropriate subject or decline path
  - workers process and publish chat.response reliably
  - kpi-worker can query seeded cosmos data
  - phoenix shows cross-service traces with propagated context
